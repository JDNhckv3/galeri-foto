<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JIDIN_IP_SCANNER // ULTIMATE_HACKER_CONSOLE_v8.0</title>
  
  <!-- Leaflet CSS untuk Peta Visual -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Courier New', Courier, monospace;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      background-color: #030303;
      color: #00ff66;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    #matrixCanvas {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      z-index: 1;
      opacity: 0.12;
      pointer-events: none;
    }

    body::before {
      content: " ";
      display: block;
      position: fixed;
      top: 0; left: 0; bottom: 0; right: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.4) 50%);
      background-size: 100% 4px;
      z-index: 10;
      pointer-events: none;
    }

    .terminal-header {
      background: #001206;
      padding: 10px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #00ff66;
      height: 45px;
      z-index: 5;
    }

    .terminal-title {
      font-weight: bold;
      font-size: 13px;
      letter-spacing: 2px;
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .status-badge {
      background: #00ff66;
      color: #000;
      padding: 2px 8px;
      font-size: 10px;
      font-weight: 900;
      border-radius: 2px;
    }

    .window-buttons {
      display: flex;
      gap: 8px;
    }

    .dot {
      width: 12px; height: 12px;
      border-radius: 50%;
      display: inline-block;
    }

    .red { background: #ff5f56; }
    .yellow { background: #ffbd2e; }
    .green { background: #27c93f; }

    .main-wrapper {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1.2fr;
      gap: 15px;
      padding: 15px;
      height: calc(100vh - 45px);
      z-index: 5;
    }

    .console-tab {
      background: rgba(10, 10, 10, 0.85);
      border: 1px solid #00ff66;
      border-radius: 4px;
      box-shadow: 0 0 20px rgba(0, 255, 102, 0.15);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      backdrop-filter: blur(5px);
    }

    .tab-header {
      background: #002b11;
      padding: 10px 15px;
      font-size: 11px;
      font-weight: bold;
      border-bottom: 1px solid #00ff66;
      letter-spacing: 1px;
      color: #ffffff;
      display: flex;
      justify-content: space-between;
    }

    .tab-content {
      padding: 15px;
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }

    .hacker-logo {
      font-size: 38px;
      font-weight: 900;
      letter-spacing: 10px;
      color: #00ff66;
      text-shadow: 0 0 10px #00ff66, 0 0 20px #00ff66;
      margin-bottom: 10px;
      border-left: 6px solid #00ff66;
      padding-left: 15px;
    }

    .visual-panel {
      display: flex;
      gap: 15px;
      align-items: center;
      margin-bottom: 15px;
      background: #001508;
      padding: 10px;
      border: 1px solid #00441b;
    }

    #radarCanvas {
      width: 70px; height: 70px;
      border-radius: 50%;
      border: 1px solid #00ff66;
    }

    .system-stats {
      font-size: 11px;
      line-height: 1.5;
      color: #888;
    }

    .input-group {
      display: flex;
      align-items: center;
      margin: 10px 0;
    }

    .prompt {
      color: #00ff66;
      margin-right: 10px;
      font-weight: bold;
    }

    input[type="text"] {
      background: transparent;
      border: none;
      border-bottom: 2px solid #00ff66;
      color: #ffffff;
      font-family: 'Courier New', Courier, monospace;
      font-size: 15px;
      padding: 6px;
      outline: none;
      flex: 1;
    }

    button {
      background: #00ff66;
      color: #000;
      border: none;
      padding: 8px 22px;
      font-weight: bold;
      font-family: 'Courier New', Courier, monospace;
      cursor: pointer;
      margin-left: 10px;
      transition: all 0.2s;
    }

    button:hover {
      background: #ffffff;
      box-shadow: 0 0 15px #ffffff;
    }

    /* --- CUSTOM STYLING PETA HACKER HIJAU NEON --- */
    #mapContainer {
      width: 100%;
      height: 220px;
      margin-bottom: 15px;
      border: 1px solid #00ff66;
      border-radius: 4px;
      background: #000502;
    }

    /* Efek Filter Warna Hijau Cyber */
    #mapContainer .leaflet-tile {
      filter: brightness(0.6) invert(1) contrast(3) hue-rotate(80deg) saturate(5);
    }

    /* Hapus total teks watermark / API di pojok peta */
    .leaflet-control-attribution {
      display: none !important;
    }

    /* Custom Pop-up Peta Bergaya Terminal */
    .leaflet-popup-content-wrapper, .leaflet-popup-tip {
      background: #001508 !important;
      color: #00ff66 !important;
      border: 1px solid #00ff66;
      box-shadow: 0 0 10px rgba(0,255,102,0.5);
      font-family: 'Courier New', Courier, monospace;
    }

    .data-row {
      display: flex;
      padding: 6px 0;
      border-bottom: 1px dashed #003314;
      font-size: 12px;
    }

    .label {
      width: 200px;
      color: #00aa44;
    }

    .value {
      color: #ffffff;
      font-weight: bold;
      flex: 1;
    }

    .blink {
      animation: blinker 1s linear infinite;
    }

    @keyframes blinker {
      50% { opacity: 0; }
    }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #050505; }
    ::-webkit-scrollbar-thumb { background: #00ff66; }

    @media (max-width: 850px) {
      .main-wrapper { grid-template-columns: 1fr; overflow-y: auto; }
      html, body { overflow: auto; }
    }
  </style>
</head>
<body>

  <canvas id="matrixCanvas"></canvas>

  <div class="terminal-header">
    <div class="terminal-title">
      <span>JIDIN_CYBER_CONSOLE v8.0</span>
      <span class="status-badge">VISUAL_GEO_ENGINE</span>
    </div>
    <div style="font-size: 12px;" id="clockDisplay">00:00:00 UTC</div>
    <div class="window-buttons">
      <span class="dot red"></span>
      <span class="dot yellow"></span>
      <span class="dot green"></span>
    </div>
  </div>

  <div class="main-wrapper">
    
    <!-- TAB 1: CONTROLLER -->
    <div class="console-tab">
      <div class="tab-header">
        <span>[ TAB 01: ENGINE CONTROLLER ]</span>
        <span>NODE: ONLINE</span>
      </div>
      <div class="tab-content">
        <div class="hacker-logo">JIDIN</div>
        
        <div class="visual-panel">
          <canvas id="radarCanvas" width="70" height="70"></canvas>
          <div class="system-stats">
            <div>CPU_LOAD: <span style="color:#00ff66;" id="cpuLoad">12%</span></div>
            <div>MAP_RENDER: <span style="color:#00ff66;">CYBER_GREEN</span></div>
            <div>ENC_LEVEL: <span style="color:#00ff66;">AES-256-GCM</span></div>
          </div>
        </div>

        <div class="input-group">
          <span class="prompt">jidin@recon:~#</span>
          <input type="text" id="targetIp" placeholder="Klik SCAN (IP Anda) / ketik IP target...">
          <button onclick="triggerScan()">SCAN</button>
        </div>

        <div id="logs" style="margin-top: 10px; font-size: 11px; line-height: 1.6;"></div>
      </div>
    </div>

    <!-- TAB 2: VISUAL MAP & INTEL OUTPUT -->
    <div class="console-tab">
      <div class="tab-header">
        <span>[ TAB 02: VISUAL MAP & INTEL DATA ]</span>
        <span id="scanStatus">STATUS: IDLE</span>
      </div>
      <div class="tab-content">
        <!-- Elemen Peta -->
        <div id="mapContainer"></div>

        <!-- Detail Teks -->
        <div id="output" style="flex: 1; overflow-y: auto;">
          <p style="color: #555;">[i] Menunggu eksekusi pemindaian dari Tab 01...</p>
        </div>
      </div>
    </div>

  </div>

  <!-- Leaflet JS untuk Peta -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    function playBeep(freq = 800, type = 'sine', duration = 0.05) {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.value = freq;
        gain.gain.value = 0.05;
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    // Matrix Rain
    const matrixCanvas = document.getElementById('matrixCanvas');
    const mCtx = matrixCanvas.getContext('2d');
    function resizeCanvas() {
      matrixCanvas.width = window.innerWidth;
      matrixCanvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    const chars = '01ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz@#$%&*';
    const drops = Array(Math.floor(window.innerWidth / 14)).fill(1);
    function drawMatrix() {
      mCtx.fillStyle = 'rgba(3, 3, 3, 0.05)';
      mCtx.fillRect(0, 0, matrixCanvas.width, matrixCanvas.height);
      mCtx.fillStyle = '#00ff66';
      mCtx.font = '14px monospace';
      drops.forEach((y, i) => {
        const text = chars.charAt(Math.floor(Math.random() * chars.length));
        mCtx.fillText(text, i * 14, y * 14);
        if (y * 14 > matrixCanvas.height && Math.random() > 0.975) drops[i] = 0;
        drops[i]++;
      });
    }
    setInterval(drawMatrix, 33);

    // Radar Loop
    const rCanvas = document.getElementById('radarCanvas');
    const rCtx = rCanvas.getContext('2d');
    let angle = 0;
    function drawRadar() {
      rCtx.fillStyle = '#001508';
      rCtx.fillRect(0, 0, 70, 70);
      rCtx.strokeStyle = '#00441b';
      rCtx.beginPath();
      rCtx.arc(35, 35, 30, 0, Math.PI * 2);
      rCtx.arc(35, 35, 15, 0, Math.PI * 2);
      rCtx.stroke();
      rCtx.save();
      rCtx.translate(35, 35);
      rCtx.rotate(angle);
      rCtx.strokeStyle = '#00ff66';
      rCtx.beginPath();
      rCtx.moveTo(0, 0);
      rCtx.lineTo(30, 0);
      rCtx.stroke();
      rCtx.restore();
      angle += 0.05;
      requestAnimationFrame(drawRadar);
    }
    drawRadar();

    // Clock
    setInterval(() => {
      const now = new Date();
      document.getElementById('clockDisplay').textContent = now.toUTCString().split(' ')[4] + ' UTC';
      document.getElementById('cpuLoad').textContent = Math.floor(Math.random() * 15 + 8) + '%';
    }, 1000);

    // Inisialisasi Peta Tanpa Attribution Teks
    let map = L.map('mapContainer', { attributionControl: false }).setView([0, 0], 2);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19
    }).addTo(map);
    let marker;

    window.onload = () => { executeScan(''); };

    function triggerScan() {
      playBeep(1200, 'square', 0.08);
      executeScan(document.getElementById('targetIp').value.trim());
    }

    function executeScan(ip) {
      const outputDiv = document.getElementById('output');
      const logsDiv = document.getElementById('logs');
      const statusSpan = document.getElementById('scanStatus');
      
      statusSpan.textContent = "STATUS: SCANNING...";
      statusSpan.style.color = "#ffbd2e";
      logsDiv.innerHTML = `<p class="blink">> Melacak posisi geografis target...</p>`;

      const targetUrl = ip ? `https://ipapi.co/${ip}/json/` : `https://ipapi.co/json/`;

      fetch(targetUrl)
        .then(res => {
          if (!res.ok) throw new Error("IP tidak valid atau server tidak merespon.");
          return res.json();
        })
        .then(data => {
          if (data.error) throw new Error(data.reason);

          playBeep(600, 'sine', 0.1);
          const lat = data.latitude;
          const lon = data.longitude;

          if (lat && lon) {
            map.setView([lat, lon], 11);
            if (marker) map.removeLayer(marker);
            marker = L.marker([lat, lon]).addTo(map)
              .bindPopup(`<b>TARGET: ${data.ip}</b><br><span>${data.city}, ${data.country_name}</span>`)
              .openPopup();
          }

          logsDiv.innerHTML += `
            <p style="color: #00ff66;">[+] TARGET LOCK SUCCESS!</p>
            <p style="color: #00ff66;">[+] Peta & Koordinat berhasil diperbarui.</p>
          `;
          statusSpan.textContent = "STATUS: LOCKED";
          statusSpan.style.color = "#00ff66";

          const details = [
            { label: "TARGET_IP", val: data.ip },
            { label: "KOTA (CITY)", val: data.city || 'N/A' },
            { label: "PROVINSI (REGION)", val: data.region || 'N/A' },
            { label: "NEGARA (COUNTRY)", val: `${data.country_name || '-'} (${data.country_code || '-'})` },
            { label: "GEO_KOORDINAT", val: `${lat}, ${lon}` },
            { label: "PROVIDER_ISP", val: data.org || data.asn || "N/A" },
            { label: "ZONA_WAKTU", val: data.timezone || "N/A" }
          ];

          outputDiv.innerHTML = '';
          details.forEach(item => {
            outputDiv.innerHTML += `
              <div class="data-row">
                <span class="label">[>] ${item.label}</span>
                <span class="value">: ${item.val}</span>
              </div>
            `;
          });
        })
        .catch(err => {
          logsDiv.innerHTML += `<p style="color: #ff3333;">[!] ERROR: ${err.message}</p>`;
          statusSpan.textContent = "STATUS: ERROR";
          statusSpan.style.color = "#ff3333";
        });
    }
  </script>
</body>
</html>
  </script>
</body>
